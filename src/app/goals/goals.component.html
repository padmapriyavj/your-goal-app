<div class="form-container">
    <h1>YOUR GOALS</h1>
    <form [formGroup]="goalsForm" (ngSubmit)="saveGoal()">
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Target goal</mat-label>
          <input matInput placeholder="Enter your target goal" formControlName="targetGoal" />
        </mat-form-field>
  
        <mat-form-field appearance="outline">
          <mat-label>Start Weight</mat-label>
          <input matInput placeholder="Enter your start weight" formControlName="startWeight" />
        </mat-form-field>
      </div>
  
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Start Date</mat-label>
          <input matInput [matDatepicker]="startDatePicker" formControlName="startDate" />
          <mat-datepicker-toggle matSuffix [for]="startDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #startDatePicker></mat-datepicker>
        </mat-form-field>
  
        <mat-form-field appearance="outline">
          <mat-label>End Date</mat-label>
          <input matInput [matDatepicker]="endDatePicker" formControlName="endDate" />
          <mat-datepicker-toggle matSuffix [for]="endDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #endDatePicker></mat-datepicker>
        </mat-form-field>
      </div>
  
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Status</mat-label>
          <mat-select formControlName="status">
            <mat-option value="in progress">In Progress</mat-option>
            <mat-option value="completed">Completed</mat-option>
            <mat-option value="not started">Not Started</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
  
      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="goalsForm.invalid || isSubmitting"
      >
        Add Goal
      </button>
  
      <p *ngIf="message" class="message">{{ message }}</p>
    </form>
    <mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
    
      <ng-container matColumnDef="index">
        <mat-header-cell *matHeaderCellDef mat-sort-header> # </mat-header-cell>
        <mat-cell *matCellDef="let row; let i = index"> {{ i + 1 }} </mat-cell>
      </ng-container>
    
      <ng-container matColumnDef="targetGoal">
        <mat-header-cell *matHeaderCellDef mat-sort-header> Target Goal </mat-header-cell>
        <mat-cell *matCellDef="let row"> {{ row.targetGoal }} </mat-cell>
      </ng-container>
    
      <ng-container matColumnDef="startWeight">
        <mat-header-cell *matHeaderCellDef mat-sort-header> Start Weight </mat-header-cell>
        <mat-cell *matCellDef="let row"> {{ row.startWeight }} </mat-cell>
      </ng-container>
    
      <ng-container matColumnDef="startDate">
        <mat-header-cell *matHeaderCellDef mat-sort-header> Start Date </mat-header-cell>
        <mat-cell *matCellDef="let row"> {{ row.startDate | date }} </mat-cell>
      </ng-container>
    
      <ng-container matColumnDef="endDate">
        <mat-header-cell *matHeaderCellDef mat-sort-header> End Date </mat-header-cell>
        <mat-cell *matCellDef="let row"> {{ row.endDate | date }} </mat-cell>
      </ng-container>
    
      <ng-container matColumnDef="status">
        <mat-header-cell *matHeaderCellDef mat-sort-header> Status </mat-header-cell>
        <mat-cell *matCellDef="let row"> {{ row.status }} </mat-cell>
      </ng-container>

      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
        <mat-cell *matCellDef="let row" class="actions-cell">
          <button mat-button color="primary" (click)="editGoal(row)">Edit</button>
          
          <button mat-button color="warn" (click)="deleteGoal(row._id)">Delete</button>
        </mat-cell>
      </ng-container>
    
      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
    
    <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    
  </div>
